name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build final image and test patch compatibility
        run: docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" --tag dante-client:ci .

      - name: Verify final image
        run: |
          docker run --rm dante-client:ci sh -ec \
            'test -r /usr/lib/libdsocks.so && test "$GIT_COMMIT" = "$1"' -- "${GITHUB_SHA}"
